<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1164" viewBox="0 0 1200 1164" role="img" aria-labelledby="sheet-title sheet-description" lang="ko" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Noto Sans KR&quot;, Pretendard, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" fill="#102a43"><title id="sheet-title">ISO/IEC 27001:2022 · Amd 1:2024 요구사항 4~10항 데이터시트</title><desc id="sheet-description">정보보안 경영시스템 요구사항의 조항 번호와 KCLI 교육용 국문 항목명. Copyright © ISO · IQCS · KCLI</desc><rect width="1200" height="1164" fill="#f5f8fb"/><rect width="1200" height="158" fill="#071d38"/><rect x="36" y="27" width="4" height="102" fill="#f1c75b"/><text x="56" y="45" fill="#d9e8f5" font-size="17" font-weight="600">KCLI 연수교육 · ISO 요구사항 데이터시트</text><text x="56" y="90" fill="#fff" font-size="38" font-weight="800">ISO/IEC 27001:2022 · Amd 1:2024</text><text x="56" y="124" fill="#fff" font-size="21" font-weight="600">정보보안 경영시스템 요구사항</text><rect x="1064" y="50" width="100" height="40" rx="6" fill="#f1c75b"/><text x="1114" y="76" text-anchor="middle" font-size="17" font-weight="700">4~10항</text><rect x="36" y="184" width="554" height="34" rx="4" fill="#0b3564"/><text x="50" y="207" fill="#fff" font-size="15" font-weight="700">조항 번호</text><text x="136" y="207" fill="#fff" font-size="15" font-weight="700">교육용 국문 항목명</text><g data-chapter="4"><rect x="36" y="226" width="554" height="36" fill="#dce9f4"/><rect x="36" y="226" width="4" height="36" fill="#0b3564"/><text x="50" y="250" fill="#0b3564" font-size="18" font-weight="700">4</text><text x="136" y="250" font-size="18" font-weight="700">조직의 상황</text><g data-clause="4.1"><rect x="36" y="262" width="554" height="51" fill="#fff"/><text x="50" y="284" fill="#0b3564" font-size="16" font-weight="600">4.1</text><text x="136" y="284" font-size="17">조직과 조직의 상황 이해</text><text x="136" y="302" fill="#526577" font-size="14">추록 1 요구사항 · 기후변화가 조직의 관련 이슈인지 판단합니다.</text></g><g data-clause="4.2"><rect x="36" y="313" width="554