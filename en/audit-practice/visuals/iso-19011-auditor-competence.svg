<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><title>Evaluating auditor competence</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#75929a"/></marker></defs><rect width="960" height="540" fill="#fafcfc"/><text x="28" y="50" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#173749">Evaluating auditor competence</text><rect x="27.0" y="82" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="27.0" y="82" width="6" height="158" rx="3" fill="#146f77"/><text x="43.0" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">Determine competence</text><text x="43.0" y="135" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Start with the knowledge and</text><text x="43.0" y="157" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">skills required to meet the</text><text x="43.0" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">needs of the audit</text><text x="43.0" y="201" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">programme.</text><rect x="27.0" y="266" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="27.0" y="266" width="6" height="158" rx="3" fill="#146f77"/><text x="43.0" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">Set criteria</text><text x="43.0" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Define qualitative and</text><text x="43.0" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">quantitative criteria for</text><text x="43.0" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">evaluating competence.</text><rect x="337.3333333333333" y="82" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="337.3333333333333" y="82" width="6" height="158" rx="3" fill="#345b83"/><text x="353.3333333333333" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#345b83">Select methods</text><text x="353.3333333333333" y="135" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Combine suitable methods,</text><text x="353.3333333333333" y="157" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">such as reviewing records,</text><text x="353.3333333333333" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">interviews and observation.</text><rect x="337.3333333333333" y="266" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="337.3333333333333" y="266" width="6" height="158" rx="3" fill="#345b83"/><text x="353.3333333333333" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#345b83">Evaluate the auditor</text><text x="353.3333333333333" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Compare evidence with</text><text x="353.3333333333333" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">criteria. Address gaps and</text><text x="353.3333333333333" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">reassess where necessary.</text><rect x="647.6666666666666" y="82" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="647.6666666666666" y="82" width="6" height="158" rx="3" fill="#146f77"/><text x="663.6666666666666" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">Use the results</text><text x="663.6666666666666" y="135" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Select team members,</text><text x="663.6666666666666" y="157" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">determine development</text><text x="663.6666666666666" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">needs and monitor</text><text x="663.6666666666666" y="201" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">continuing performance.</text><path d="M169.66666666666666 241 L169.66666666666666 262" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><path d="M312.3333333333333 351 H324.3333333333333 V157 H335.3333333333333" stroke="#75929a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480.0 241 L480.0 262" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><path d="M622.6666666666666 351 H634.6666666666666 V157 H645.6666666666666" stroke="#75929a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="476" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Plan, carry out and document objective, consistent evaluations. Maintain competence through</text><text x="30" y="498" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">professional development and audit experience.</text></svg>
