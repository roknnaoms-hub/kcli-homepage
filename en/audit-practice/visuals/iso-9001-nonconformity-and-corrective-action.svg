<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><title>When a nonconformity is detected</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#75929a"/></marker></defs><rect width="960" height="540" fill="#fafcfc"/><text x="28" y="50" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#173749">When a nonconformity is detected</text><rect x="255" y="77" width="450" height="87" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="255" y="77" width="6" height="87" rx="3" fill="#146f77"/><text x="271" y="104" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">Detection</text><text x="271" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">An inspection, customer complaint or audit</text><text x="271" y="152" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">identifies a problem.</text><path d="M400 165 L246 192" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><path d="M550 165 L704 192" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><rect x="27" y="196" width="442" height="238" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="27" y="196" width="6" height="238" rx="3" fill="#146f77"/><text x="43" y="223" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">8.7 · Control nonconforming outputs</text><text x="43" y="249" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Identify and control affected outputs. Choose</text><text x="43" y="271" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">appropriate action such as correction,</text><text x="43" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">segregation, return, suspension of delivery,</text><text x="43" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">informing customers or obtaining a concession.</text><text x="43" y="337" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Recheck conformity after correction and retain</text><text x="43" y="359" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">records.</text><rect x="492" y="196" width="442" height="238" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="492" y="196" width="6" height="238" rx="3" fill="#a35622"/><text x="508" y="223" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#a35622">10.2 · Corrective action</text><text x="508" y="249" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Control and correct the nonconformity and deal</text><text x="508" y="271" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">with consequences. Assess causes and similar</text><text x="508" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">problems, implement action and review</text><text x="508" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">effectiveness. Update risks and opportunities</text><text x="508" y="337" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">and the system as necessary. Retain records.</text><text x="30" y="475" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Control the affected output and evaluate the need to prevent the same cause from producing problems</text><text x="30" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">elsewhere.</text></svg>
