<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><title>Managing the audit programme</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#75929a"/></marker></defs><rect width="960" height="540" fill="#fafcfc"/><text x="28" y="50" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#173749">Managing the audit programme</text><rect x="27.0" y="82" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="27.0" y="82" width="6" height="158" rx="3" fill="#146f77"/><text x="43.0" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">5.2 · Set objectives</text><text x="43.0" y="135" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Align programme objectives</text><text x="43.0" y="157" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">with the strategic direction of</text><text x="43.0" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">the audit client.</text><rect x="27.0" y="266" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="27.0" y="266" width="6" height="158" rx="3" fill="#146f77"/><text x="43.0" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">5.3 · Assess risks</text><text x="43.0" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Identify and evaluate risks</text><text x="43.0" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">and opportunities affecting</text><text x="43.0" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">the programme itself.</text><rect x="337.3333333333333" y="82" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="337.3333333333333" y="82" width="6" height="158" rx="3" fill="#345b83"/><text x="353.3333333333333" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#345b83">5.4 · Establish the</text><text x="353.3333333333333" y="133" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#345b83">programme</text><text x="353.3333333333333" y="159" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Assign roles, competence</text><text x="353.3333333333333" y="181" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">and resources. Determine the</text><text x="353.3333333333333" y="203" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">extent and obtain approval.</text><rect x="337.3333333333333" y="266" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="337.3333333333333" y="266" width="6" height="158" rx="3" fill="#345b83"/><text x="353.3333333333333" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#345b83">5.5 · Implement</text><text x="353.3333333333333" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Set audit objectives, scope,</text><text x="353.3333333333333" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">criteria and methods. Select</text><text x="353.3333333333333" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">teams and manage results</text><text x="353.3333333333333" y="385" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">and records.</text><rect x="647.6666666666666" y="82" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="647.6666666666666" y="82" width="6" height="158" rx="3" fill="#146f77"/><text x="663.6666666666666" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">5.6 · Monitor</text><text x="663.6666666666666" y="135" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Track schedules,</text><text x="663.6666666666666" y="157" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">achievement of objectives,</text><text x="663.6666666666666" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">team performance, feedback</text><text x="663.6666666666666" y="201" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">and records.</text><rect x="647.6666666666666" y="266" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="647.6666666666666" y="266" width="6" height="158" rx="3" fill="#146f77"/><text x="663.6666666666666" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">5.7 · Review and improve</text><text x="663.6666666666666" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Assess results and lessons</text><text x="663.6666666666666" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">learned. Update the</text><text x="663.6666666666666" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">programme to improve it.</text><path d="M169.66666666666666 241 L169.66666666666666 262" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><path d="M312.3333333333333 351 H324.3333333333333 V157 H335.3333333333333" stroke="#75929a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480.0 241 L480.0 262" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><path d="M622.6666666666666 351 H634.6666666666666 V157 H645.6666666666666" stroke="#75929a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M790.3333333333333 241 L790.3333333333333 262" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="476" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Individual audits follow clause 6. Use competence evidence from clause 7 when selecting teams and</text><text x="30" y="498" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">reviewing the programme.</text></svg>
