<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><title>Follow a process from source to recipient</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#75929a"/></marker></defs><rect width="960" height="540" fill="#fafcfc"/><text x="28" y="50" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#173749">Follow a process from source to recipient</text><rect x="27.0" y="82" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="27.0" y="82" width="6" height="158" rx="3" fill="#146f77"/><text x="43.0" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">Sources of inputs</text><text x="43.0" y="135" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Previous processes, internal</text><text x="43.0" y="157" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">or external providers and</text><text x="43.0" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">other interested parties.</text><rect x="27.0" y="266" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="27.0" y="266" width="6" height="158" rx="3" fill="#146f77"/><text x="43.0" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">Inputs</text><text x="43.0" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Materials, resources,</text><text x="43.0" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">requirements, information</text><text x="43.0" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">and energy.</text><rect x="337.3333333333333" y="82" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="337.3333333333333" y="82" width="6" height="158" rx="3" fill="#345b83"/><text x="353.3333333333333" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#345b83">Activities</text><text x="353.3333333333333" y="135" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Transform inputs using</text><text x="353.3333333333333" y="157" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">people, resources,</text><text x="353.3333333333333" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">competence, methods and</text><text x="353.3333333333333" y="201" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">criteria.</text><rect x="337.3333333333333" y="266" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="337.3333333333333" y="266" width="6" height="158" rx="3" fill="#345b83"/><text x="353.3333333333333" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#345b83">Outputs</text><text x="353.3333333333333" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Products, services,</text><text x="353.3333333333333" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">information, decisions and</text><text x="353.3333333333333" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">results.</text><rect x="647.6666666666666" y="82" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="647.6666666666666" y="82" width="6" height="158" rx="3" fill="#146f77"/><text x="663.6666666666666" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">Recipients of outputs</text><text x="663.6666666666666" y="135" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Subsequent processes,</text><text x="663.6666666666666" y="157" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">customers and other</text><text x="663.6666666666666" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">interested parties.</text><path d="M169.66666666666666 241 L169.66666666666666 262" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><path d="M312.3333333333333 351 H324.3333333333333 V157 H335.3333333333333" stroke="#75929a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480.0 241 L480.0 262" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><path d="M622.6666666666666 351 H634.6666666666666 V157 H645.6666666666666" stroke="#75929a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="476" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Choose monitoring and measurement points to match the process and its risks. The output of one</text><text x="30" y="498" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">process often becomes the input to another.</text></svg>
