<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><title>PDCA in ISO 9001</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#75929a"/></marker></defs><rect width="960" height="540" fill="#fafcfc"/><text x="28" y="50" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#173749">PDCA in ISO 9001</text><rect x="26" y="89" width="206" height="142" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="26" y="89" width="6" height="142" rx="3" fill="#146f77"/><text x="42" y="116" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">Context · 4.1–4.2</text><text x="42" y="142" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Organisational</text><text x="42" y="164" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">context and the</text><text x="42" y="186" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">needs of interested</text><text x="42" y="208" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">parties.</text><rect x="26" y="275" width="206" height="142" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="26" y="275" width="6" height="142" rx="3" fill="#146f77"/><text x="42" y="302" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">System · 4.3–4.4</text><text x="42" y="328" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Define the scope</text><text x="42" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">and the interacting</text><text x="42" y="372" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">processes.</text><rect x="280" y="92" width="197" height="125" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="280" y="92" width="6" height="125" rx="3" fill="#146f77"/><text x="296" y="119" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">Plan · 6</text><text x="296" y="145" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Set objectives and</text><text x="296" y="167" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">plan actions and</text><text x="296" y="189" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">resources.</text><rect x="514" y="92" width="197" height="125" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="514" y="92" width="6" height="125" rx="3" fill="#146f77"/><text x="530" y="119" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">Do · 7–8</text><text x="530" y="145" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Support and</text><text x="530" y="167" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">operate the</text><text x="530" y="189" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">processes.</text><rect x="514" y="290" width="197" height="125" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="514" y="290" width="6" height="125" rx="3" fill="#146f77"/><text x="530" y="317" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">Check · 9</text><text x="530" y="343" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Evaluate</text><text x="530" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">performance and</text><text x="530" y="387" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">review results.</text><rect x="280" y="290" width="197" height="125" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="280" y="290" width="6" height="125" rx="3" fill="#146f77"/><text x="296" y="317" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">Act · 10</text><text x="296" y="343" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Improve the</text><text x="296" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">system and</text><text x="296" y="387" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">address causes.</text><path d="M477 151 L505 151" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><path d="M606 220 L606 283" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><path d="M513 350 L482 350" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><path d="M370 287 L370 224" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><text x="496" y="258" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#146f77">5 · Leadership</text><rect x="749" y="119" width="185" height="244" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="749" y="119" width="6" height="244" rx="3" fill="#146f77"/><text x="765" y="146" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">Outcomes</text><text x="765" y="172" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Products and</text><text x="765" y="194" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">services,</text><text x="765" y="216" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">intended system</text><text x="765" y="238" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">results and</text><text x="765" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">customer</text><text x="765" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">satisfaction.</text><path d="M714 240 L743 240" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="465" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Leadership links every stage. Apply PDCA to the whole management system or to an individual process.</text></svg>
