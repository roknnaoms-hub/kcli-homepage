<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><title>Responding to risks and opportunities</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#75929a"/></marker></defs><rect width="960" height="540" fill="#fafcfc"/><text x="28" y="50" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#173749">Responding to risks and opportunities</text><rect x="255" y="77" width="450" height="87" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="255" y="77" width="6" height="87" rx="3" fill="#146f77"/><text x="271" y="104" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">6.1.1 · Identify risks and opportunities</text><text x="271" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Review context (4.1) and interested parties’</text><text x="271" y="152" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">needs (4.2).</text><path d="M400 165 L246 192" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><path d="M550 165 L704 192" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><rect x="27" y="196" width="442" height="238" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="27" y="196" width="6" height="238" rx="3" fill="#146f77"/><text x="43" y="223" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">6.1.2 · Risks</text><text x="43" y="249" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Identify and evaluate risks. Plan proportionate</text><text x="43" y="271" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">actions and integrate them into operations</text><text x="43" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">(4.4.1 g, 8.1). Check effectiveness (9.1.3 e) and</text><text x="43" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">review the results (9.3.2 g).</text><rect x="492" y="196" width="442" height="238" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="492" y="196" width="6" height="238" rx="3" fill="#a35622"/><text x="508" y="223" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#a35622">6.1.3 · Opportunities</text><text x="508" y="249" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Identify and evaluate opportunities. Plan</text><text x="508" y="271" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">suitable actions and integrate them into</text><text x="508" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">operations (4.4.1 g, 8.1). Evaluate effectiveness</text><text x="508" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">(9.1.3 f) and review results (9.3.2 h).</text><text x="30" y="475" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Use monitoring, review and continual improvement to update risks and opportunities, including after a</text><text x="30" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">nonconformity.</text></svg>
