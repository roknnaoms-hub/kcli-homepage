<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><title>Six stages of an individual audit</title><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#75929a"/></marker></defs><rect width="960" height="540" fill="#fafcfc"/><text x="28" y="50" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#173749">Six stages of an individual audit</text><rect x="27.0" y="82" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="27.0" y="82" width="6" height="158" rx="3" fill="#146f77"/><text x="43.0" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">6.2 · Initiate</text><text x="43.0" y="135" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Contact the auditee and</text><text x="43.0" y="157" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">determine whether the audit</text><text x="43.0" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">is feasible.</text><rect x="27.0" y="266" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="27.0" y="266" width="6" height="158" rx="3" fill="#146f77"/><text x="43.0" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">6.3 · Prepare</text><text x="43.0" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Review records, plan</text><text x="43.0" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">activities, allocate</text><text x="43.0" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">assignments and prepare</text><text x="43.0" y="385" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">working documents.</text><rect x="337.3333333333333" y="82" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="337.3333333333333" y="82" width="6" height="158" rx="3" fill="#345b83"/><text x="353.3333333333333" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#345b83">6.4 · Conduct</text><text x="353.3333333333333" y="135" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Hold the opening meeting,</text><text x="353.3333333333333" y="157" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">gather and verify evidence,</text><text x="353.3333333333333" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">agree findings and</text><text x="353.3333333333333" y="201" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">conclusions, and close the</text><text x="353.3333333333333" y="223" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">meeting.</text><rect x="337.3333333333333" y="266" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="337.3333333333333" y="266" width="6" height="158" rx="3" fill="#345b83"/><text x="353.3333333333333" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#345b83">6.5 · Report</text><text x="353.3333333333333" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Prepare and distribute the</text><text x="353.3333333333333" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">audit report.</text><rect x="647.6666666666666" y="82" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="647.6666666666666" y="82" width="6" height="158" rx="3" fill="#146f77"/><text x="663.6666666666666" y="109" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">6.6 · Complete</text><text x="663.6666666666666" y="135" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Close planned activities and</text><text x="663.6666666666666" y="157" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">retain or dispose of</text><text x="663.6666666666666" y="179" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">documented information as</text><text x="663.6666666666666" y="201" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">agreed.</text><rect x="647.6666666666666" y="266" width="285.3333333333333" height="158" rx="10" fill="#fff" stroke="#aabfc3" stroke-width="2"/><rect x="647.6666666666666" y="266" width="6" height="158" rx="3" fill="#146f77"/><text x="663.6666666666666" y="293" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#146f77">6.7 · Follow up</text><text x="663.6666666666666" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Where agreed, verify</text><text x="663.6666666666666" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">completion and effectiveness</text><text x="663.6666666666666" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">of actions.</text><path d="M169.66666666666666 241 L169.66666666666666 262" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><path d="M312.3333333333333 351 H324.3333333333333 V157 H335.3333333333333" stroke="#75929a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480.0 241 L480.0 262" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><path d="M622.6666666666666 351 H634.6666666666666 V157 H645.6666666666666" stroke="#75929a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M790.3333333333333 241 L790.3333333333333 262" fill="none" stroke="#75929a" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="476" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173749">Use the audit plan to coordinate responsibilities, the timetable and follow-up arrangements.</text></svg>
